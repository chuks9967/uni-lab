# Fly.io config for the UniBursar cloud hub — ALWAYS ON + PERSISTENT (free volume).
#
# IMPORTANT: do NOT use `fly launch` (its source scanner fails with
# "Could not detect runtime or Dockerfile"). Use `fly deploy`, which builds
# straight from this file + the Dockerfile. Run every command from THIS folder
# (the one containing server.js, portal.js, package.json, Dockerfile, fly.toml):
#
#   fly apps create uni-lab
#   fly volumes create unibursar_data --size 1 --region iad -a uni-lab -y
#   fly secrets set SYNC_TOKEN=PUT-A-LONG-RANDOM-STRING -a uni-lab
#   fly deploy -a uni-lab
#   fly status -a uni-lab        # shows your https URL
#
# Set `app` below to the SAME name you created (uni-lab), and keep the volume in
# the SAME region as `primary_region`.

app = "uni-lab"                   # <-- the app name you created with `fly apps create`
primary_region = "iad"            # pick the region nearest your users (keep the volume here too)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"              # persisted on the mounted volume below

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false      # never sleep — always on
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "unibursar_data"       # the volume created above
  destination = "/data"
